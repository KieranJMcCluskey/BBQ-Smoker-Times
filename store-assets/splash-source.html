<!doctype html><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Crimson+Pro:wght@300&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:2732px;height:2732px;background:#0d0d0d;overflow:hidden;
    display:flex;align-items:center;justify-content:center}
  /* Splash gets centre-cropped to every device aspect, so everything that
     matters lives well inside the middle square. */
  .wrap{width:1200px;text-align:center;position:relative}
  .glow{position:absolute;left:50%;top:44%;width:1500px;height:1500px;
    transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle,rgba(255,107,0,.22) 0%,rgba(255,51,0,.10) 38%,transparent 66%)}
  .flame{font-size:400px;line-height:1;position:relative}
  h1{position:relative;font-family:"Playfair Display",Georgia,serif;font-weight:900;
    font-size:150px;letter-spacing:-.02em;color:#f3e7cb;margin-top:40px}
  .rule{position:relative;width:200px;height:5px;margin:44px auto 0;
    background:linear-gradient(90deg,transparent,#c0392b,transparent)}
  .sub{position:relative;font-family:"Crimson Pro",Georgia,serif;font-size:52px;
    letter-spacing:.34em;color:#a89372;margin-top:44px;text-transform:uppercase}
</style>
<div class="wrap">
  <div class="glow"></div>
  <div class="flame">🔥</div>
  <h1>FIRE &amp; SMOKE</h1>
  <div class="rule"></div>
  <div class="sub">The Pitmaster's Reference</div>
</div>
