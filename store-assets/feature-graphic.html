<!doctype html><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Crimson+Pro:wght@300;400&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  /* Google Play feature graphic: exactly 1024x500, no transparency.
     Play crops the edges on some surfaces, so nothing important goes near them. */
  body{width:1024px;height:500px;overflow:hidden;background:#0d0d0d;
    display:flex;align-items:center;gap:44px;padding:0 74px;position:relative}
  .glow{position:absolute;left:130px;top:50%;width:620px;height:620px;transform:translateY(-50%);
    border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(255,107,0,.26) 0%,rgba(255,51,0,.10) 40%,transparent 68%)}
  .flame{font-size:190px;line-height:1;position:relative;flex:none}
  .txt{position:relative}
  h1{font-family:"Playfair Display",Georgia,serif;font-weight:900;font-size:76px;
    letter-spacing:-.02em;color:#f3e7cb;line-height:1}
  .rule{width:150px;height:3px;margin:20px 0;
    background:linear-gradient(90deg,#c0392b,transparent)}
  .sub{font-family:"Crimson Pro",Georgia,serif;font-size:27px;color:#a89372;letter-spacing:.05em}
  .chips{display:flex;gap:11px;margin-top:26px}
  .chip{font-family:"Crimson Pro",Georgia,serif;font-size:17px;color:#dcc79c;
    border:1px solid #3a2c1e;border-radius:3px;padding:7px 14px;white-space:nowrap}
</style>
<div class="glow"></div>
<div class="flame">🔥</div>
<div class="txt">
  <h1>FIRE &amp; SMOKE</h1>
  <div class="rule"></div>
  <div class="sub">Cook times · Internal temps · Live timer</div>
  <div class="chips">
    <span class="chip">Smoker &amp; grill</span>
    <span class="chip">70 cuts</span>
    <span class="chip">°C / °F</span>
  </div>
</div>
